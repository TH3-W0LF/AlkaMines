# Configuracao do AlkaMines.

# Comandos bloqueados dentro da area de uma mina (o lobbyRegion definido via
# /minaadmin setlobby, ou a propria regiao de mineracao se nenhum lobby foi
# configurado) para jogadores sem a permissao alkaminas.admin.bypass.commands.
# Cada entrada e o nome do comando SEM a barra e SEM argumentos (ex: "tp" bloqueia
# tanto "/tp" quanto "/tp Steve", mas nao um comando de outro plugin chamado "/tpstats").
mine-protection:
  blocked-commands:
    - back
    - return
    - tp
    - teleport
    - tpa
    - tpahere
    - tpask
    - tpyes
    - tpaccept
    - home
    - sethome
    - warp
    - spawn
    - lobby
    - hub
    - tpo
    - tppos
    - etp
    - rtp

# Niveis de picareta baseados em blocos minerados (lifetime, players.yml). Formato:
# nivel: blocos_necessarios. O jogador sobe de nivel automaticamente ao minerar o
# suficiente (ver MineBreakListener). Use min-pickaxe-level (por mina, no menu
# /minaadmin -> Configurar Reset) pra criar minas exclusivas por nivel.
pickaxe-levels:
  0: 0          # nivel inicial - todo jogador comeca aqui
  1: 1000
  2: 5000
  3: 25000
  4: 100000
  5: 500000
  6: 2000000
  7: 5000000
  8: 10000000
  9: 20000000

# XP do mcMMO (skill Mineracao) por bloco quebrado dentro de uma mina - so tem
# efeito com o mcMMO instalado (ver McMMOHook). Chave = nome do Material do Bukkit,
# OU o namespace de um bloco custom do ItemsAdder (ex: "myitems:ruby_ore"). Serve so
# de FALLBACK global: se o bloco tiver um XP de mcMMO definido direto na composicao
# da mina (menu Composicao de Blocos -> clique direito/shift+esquerdo no bloco), esse
# valor por bloco sempre tem prioridade sobre esta tabela.
mcmmo-xp:
  STONE: 1.0
  DEEPSLATE: 1.0
  COAL_ORE: 2.0
  DEEPSLATE_COAL_ORE: 2.5
  IRON_ORE: 3.0
  DEEPSLATE_IRON_ORE: 3.5
  GOLD_ORE: 4.0
  DEEPSLATE_GOLD_ORE: 4.5
  DIAMOND_ORE: 5.0
  DEEPSLATE_DIAMOND_ORE: 5.5
  EMERALD_ORE: 6.0
  DEEPSLATE_EMERALD_ORE: 6.5
  REDSTONE_ORE: 2.0
  DEEPSLATE_REDSTONE_ORE: 2.5
  LAPIS_ORE: 2.0
  DEEPSLATE_LAPIS_ORE: 2.5
  COPPER_ORE: 2.0
  DEEPSLATE_COPPER_ORE: 2.5
  OBSIDIAN: 3.0
  ANCIENT_DEBRIS: 8.0
  NETHER_QUARTZ_ORE: 2.0
  NETHER_GOLD_ORE: 3.0
  # Exemplo com bloco custom do ItemsAdder:
  # myitems:ruby_ore: 10.0
