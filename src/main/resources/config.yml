# Configuracao do AlkaMines.

# Habilita o log de debug do AlkaMines no console ([AlkaMines-DEBUG]) - mostra o
# que acontece por evento (mina encontrada por posicao, drops, resets com timing
# do FAWE, protecao). Zero custo quando desligado. Tambem da pra alternar em
# runtime com /alkamines debug.
debug: false

# Limite opcional de tamanho de mina (area X*Z em blocos, ex: 70x70 = 4900).
# 0 = sem limite. Checado na criacao via /alkamines criar: minas gigantes pesam
# no servidor (reset FAWE com milhoes de blocos, luz, chunks, holorma) e tambem
# podem estourar o contador de blocos restantes (int). Ajuste pro seu planejamento.
max-mine-size: 0

# Minas particulares (PlotSquared): quantas minas particulares cada grupo pode ter.
# A chave e usada como permissao - o jogador pode ter varias; o limite final e o MAIOR
# valor entre as permissoes que ele tem. "default" vale pra quem nao tem nenhuma.
# Ex: jogador com permissao "vip" e "mvp" tem limite 3 (o maximo).
private-mine-limits:
  default: 0
  vip: 1
  vip2: 2
  mvp: 3


# Comandos bloqueados dentro da area de uma mina (o lobbyRegion definido via
# /alkamines setlobby, ou a propria regiao de mineracao se nenhum lobby foi
# configurado) para jogadores sem a permissao alkaminas.admin.bypass.commands.
# Cada entrada e o nome do comando SEM a barra e SEM argumentos (ex: "tp" bloqueia
# tanto "/tp" quanto "/tp Steve", mas nao um comando de outro plugin chamado "/tpstats").
mine-protection:
  blocked-commands:
    - back
    - return
    - tp
    - teleport
    - tpa
    - tpahere
    - tpask
    - tpyes
    - tpaccept
    - home
    - sethome
    - warp
    - spawn
    - lobby
    - hub
    - tpo
    - tppos
    - etp
    - rtp

# Niveis de picareta baseados em blocos minerados (lifetime, players.yml). Formato:
# nivel: blocos_necessarios. O jogador sobe de nivel automaticamente ao minerar o
# suficiente (ver MineBreakListener). Use min-pickaxe-level (por mina, no menu
# /alkamines -> Configurar Reset) pra criar minas exclusivas por nivel.
pickaxe-levels:
  0: 0          # nivel inicial - todo jogador comeca aqui
  1: 1000
  2: 5000
  3: 25000
  4: 100000
  5: 500000
  6: 2000000
  7: 5000000
  8: 10000000
  9: 20000000

# XP do mcMMO (skill Mineracao) por bloco quebrado dentro de uma mina - so tem
# efeito com o mcMMO instalado (ver McMMOHook). Chave = nome do Material do Bukkit.
# Serve so de FALLBACK global: vale apenas pro bloco que NAO teve XP de mcMMO
# configurado na composicao da mina (menu Composicao de Blocos -> shift+esquerdo).
# Se o bloco tiver XP configurado na mina, aquele valor e o unico usado - 0 = sem XP.
mcmmo-xp:
  STONE: 1.0
  DEEPSLATE: 1.0
  COAL_ORE: 2.0
  DEEPSLATE_COAL_ORE: 2.5
  IRON_ORE: 3.0
  DEEPSLATE_IRON_ORE: 3.5
  GOLD_ORE: 4.0
  DEEPSLATE_GOLD_ORE: 4.5
  DIAMOND_ORE: 5.0
  DEEPSLATE_DIAMOND_ORE: 5.5
  EMERALD_ORE: 6.0
  DEEPSLATE_EMERALD_ORE: 6.5
  REDSTONE_ORE: 2.0
  DEEPSLATE_REDSTONE_ORE: 2.5
  LAPIS_ORE: 2.0
  DEEPSLATE_LAPIS_ORE: 2.5
  COPPER_ORE: 2.0
  DEEPSLATE_COPPER_ORE: 2.5
  OBSIDIAN: 3.0
  ANCIENT_DEBRIS: 8.0
  NETHER_QUARTZ_ORE: 2.0
  NETHER_GOLD_ORE: 3.0
