# Configuracao do AlkaMines.

# Habilita o log de debug do AlkaMines no console ([AlkaMines-DEBUG]) - mostra o
# que acontece por evento (mina encontrada por posicao, drops, resets com timing
# do FAWE, protecao). Zero custo quando desligado. Tambem da pra alternar em
# runtime com /alkamines debug.
debug: false

# Limite opcional de tamanho de mina (area X*Z em blocos, ex: 70x70 = 4900).
# 0 = sem limite. Checado na criacao via /alkamines criar: minas gigantes pesam
# no servidor (reset FAWE com milhoes de blocos, luz, chunks, holorma) e tambem
# podem estourar o contador de blocos restantes (int). Ajuste pro seu planejamento.
max-mine-size: 0

# Minas particulares (PlotSquared): quantas minas particulares cada grupo pode ter.
# A chave e usada como permissao - o jogador pode ter varias; o limite final e o MAIOR
# valor entre as permissoes que ele tem. "default" vale pra quem nao tem nenhuma.
# Ex: jogador com permissao "vip" e "mvp" tem limite 3 (o maximo).
private-mine-limits:
  default: 0
  vip: 1
  vip2: 2
  mvp: 3

# ADENDO: margem (em blocos) de cada lado da plot que a mina particular (schematic)
# respeita ao ser colada. O schematic e centralizado na plot e, se couber, fica com essa
# margem das paredes. Se o schematic for maior que a plot menos 2x a margem, o plugin
# mantem a mina dentro da plot sem margem e avisa no debug. Ajustavel no futuro.
private-mine-margin: 4

# O QUE o jogador pode minerar dentro da mina particular.
# - whitelist: se preenchida, SO esses blocos sao mineraveis (ex: so minerios).
#   Vazio = qualquer bloco da composicao do template.
# - blacklist: blocos que NUNCA sao mineraveis mesmo se estiverem na composicao
#   (ex: blocos cheios de minerio, paredes de bloco).
private-mine-mining:
  whitelist:
    - GOLD_ORE
    - DEEPSLATE_GOLD_ORE
    - DIAMOND_ORE
    - DEEPSLATE_DIAMOND_ORE
    - EMERALD_ORE
    - DEEPSLATE_EMERALD_ORE
    - LAPIS_ORE
    - DEEPSLATE_LAPIS_ORE
    - REDSTONE_ORE
    - DEEPSLATE_REDSTONE_ORE
    - IRON_ORE
    - DEEPSLATE_IRON_ORE
    - COAL_ORE
    - DEEPSLATE_COAL_ORE
    - COPPER_ORE
    - DEEPSLATE_COPPER_ORE
    - NETHER_GOLD_ORE
    - NETHER_QUARTZ_ORE
    - ANCIENT_DEBRIS
  blacklist:
    - GOLD_BLOCK
    - DIAMOND_BLOCK
    - EMERALD_BLOCK
    - LAPIS_BLOCK
    - REDSTONE_BLOCK
    - IRON_BLOCK
    - COAL_BLOCK
    - COPPER_BLOCK
    - NETHERITE_BLOCK
    - QUARTZ_BLOCK
    - AMETHYST_BLOCK

# Menu da mina particular (/mina particular menu) - tempo de reset e upgrade.
# Tempos de reset disponiveis por permissao (a chave e usada como permissao; jogador
# normal so tem o default, cada grupo libera mais opcoes).
private-mine-reset-times:
  default: [30]
  vip: [15, 30, 60]
  mvp: [5, 10, 15, 30, 60]
# Custo e moeda do upgrade (expandir). A moeda e qualquer currencyId da AlkaEconomy
# (ex: coins, escarion). O upgrade expande a mina em private-mine-expand-amount blocos
# pra cada lado em X/Z (a altura Y nunca muda), sempre parando private-mine-expand-wall-margin
# blocos ANTES da parede da plot (nunca encosta na borda). O custo ESCALONA com o nivel
# da mina (nivel 0 = base, 1 = 2x base, etc).
private-mine-upgrade-cost: 10000
private-mine-upgrade-currency: coins
private-mine-expand-amount: 3
private-mine-expand-wall-margin: 2

# Limite de TAMANHO do upgrade por permissao (half-size = distancia do centro ate a
# borda da mina em X/Z). 0 = sem limite extra (so a plot). A chave e usada como
# permissao; o limite final e o MAIOR entre as que o jogador tem.
private-mine-upgrade-size-limit:
  default: 0
  vip: 20
  mvp: 30


# Comandos bloqueados dentro da area de uma mina (o lobbyRegion definido via
# /alkamines setlobby, ou a propria regiao de mineracao se nenhum lobby foi
# configurado) para jogadores sem a permissao alkaminas.admin.bypass.commands.
# Cada entrada e o nome do comando SEM a barra e SEM argumentos (ex: "tp" bloqueia
# tanto "/tp" quanto "/tp Steve", mas nao um comando de outro plugin chamado "/tpstats").
mine-protection:
  blocked-commands:
    - back
    - return
    - tp
    - teleport
    - tpa
    - tpahere
    - tpask
    - tpyes
    - tpaccept
    - home
    - sethome
    - warp
    - spawn
    - lobby
    - hub
    - tpo
    - tppos
    - etp
    - rtp

# Niveis de picareta baseados em blocos minerados (lifetime, players.yml). Formato:
# nivel: blocos_necessarios. O jogador sobe de nivel automaticamente ao minerar o
# suficiente (ver MineBreakListener). Use min-pickaxe-level (por mina, no menu
# /alkamines -> Configurar Reset) pra criar minas exclusivas por nivel.
pickaxe-levels:
  0: 0          # nivel inicial - todo jogador comeca aqui
  1: 1000
  2: 5000
  3: 25000
  4: 100000
  5: 500000
  6: 2000000
  7: 5000000
  8: 10000000
  9: 20000000

# XP do mcMMO (skill Mineracao) por bloco quebrado dentro de uma mina - so tem
# efeito com o mcMMO instalado (ver McMMOHook). Chave = nome do Material do Bukkit.
# Serve so de FALLBACK global: vale apenas pro bloco que NAO teve XP de mcMMO
# configurado na composicao da mina (menu Composicao de Blocos -> shift+esquerdo).
# Se o bloco tiver XP configurado na mina, aquele valor e o unico usado - 0 = sem XP.
mcmmo-xp:
  STONE: 1.0
  DEEPSLATE: 1.0
  COAL_ORE: 2.0
  DEEPSLATE_COAL_ORE: 2.5
  IRON_ORE: 3.0
  DEEPSLATE_IRON_ORE: 3.5
  GOLD_ORE: 4.0
  DEEPSLATE_GOLD_ORE: 4.5
  DIAMOND_ORE: 5.0
  DEEPSLATE_DIAMOND_ORE: 5.5
  EMERALD_ORE: 6.0
  DEEPSLATE_EMERALD_ORE: 6.5
  REDSTONE_ORE: 2.0
  DEEPSLATE_REDSTONE_ORE: 2.5
  LAPIS_ORE: 2.0
  DEEPSLATE_LAPIS_ORE: 2.5
  COPPER_ORE: 2.0
  DEEPSLATE_COPPER_ORE: 2.5
  OBSIDIAN: 3.0
  ANCIENT_DEBRIS: 8.0
  NETHER_QUARTZ_ORE: 2.0
  NETHER_GOLD_ORE: 3.0
