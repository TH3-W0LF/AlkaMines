# ============================================================
# ALKAMINES - Mensagens de chat
# Formatacao MiniMessage (<red>, <green>, <gradient>, etc) - NUNCA codigos & legados
# (regra do estudio: toda mensagem de chat passa pelo MessageProvider do AlkaCore,
# que so entende MiniMessage). Hologramas usam & a parte (holograms.yml, DHAPI-only).
# {prefix} e substituido primeiro, depois {placeholders} especificos de cada chave.
# Rode /alkamines reload apos editar.
# ============================================================

prefix: "<dark_gray>[<gold>AlkaMines<dark_gray>] "

generic:
  cancelled: "{prefix}<red>Operação cancelada."
  success: "{prefix}<green>Ação realizada com sucesso."
  no-permission: "{prefix}<red>Você não tem permissão para isso."
  player-only: "{prefix}<red>Apenas jogadores podem usar esse comando."
  invalid-number: "{prefix}<red>Valor inválido. Digite um número válido."
  negative-value: "{prefix}<red>O valor não pode ser negativo."
  player-offline: "{prefix}<red>Jogador offline: <white>{player}"
  player-not-found: "{prefix}<red>Jogador não encontrado."

error:
  mine-not-found: "{prefix}<red>Mina não encontrada: <white>{mine}"
  mine-exists: "{prefix}<red>Já existe uma mina com o ID '<white>{mine}<red>'."
  invalid-id: "{prefix}<red>ID inválido. Use apenas letras, números, underscore e hífen."
  no-selection: "{prefix}<red>Você precisa de uma seleção válida do WorldEdit (<gray>//pos1, //pos2<red>)."
  mine-too-large: "{prefix}<red>Mina muito grande: <white>{area} <red>blocos de área (X×Z). Limite: <white>{limit}<red>. Ajuste em config.yml."
  template-not-found: "{prefix}<red>Template de mina particular não encontrado: <white>{template}"
  hologram-offline: "{prefix}<red>DecentHolograms não está instalado neste servidor."
  unknown-subcommand: "{prefix}<red>Subcomando desconhecido."
  usage:
    admin: "{prefix}<red>Uso: <gray>/alkamines <subcomando>"
    create: "{prefix}<red>Uso: <gray>/alkamines criar <id>"
    delete: "{prefix}<red>Uso: <gray>/alkamines deletar <id>"
    edit: "{prefix}<red>Uso: <gray>/alkamines editar <id>"
    reset: "{prefix}<red>Uso: <gray>/alkamines resetar <id>"
    setspawn: "{prefix}<red>Uso: <gray>/alkamines setspawn <id>"
    setlobby: "{prefix}<red>Uso: <gray>/alkamines setlobby <id>"
    removelobby: "{prefix}<red>Uso: <gray>/alkamines removelobby <id>"
    rename: "{prefix}<red>Uso: <gray>/alkamines renomear <id> <nome>"
    give-generator: "{prefix}<red>Uso: <gray>/alkamines givegerador <jogador> <template>"
    register: "{prefix}<red>Uso: <gray>/alkamines registrarmina <template> [nome]"
    particular: "{prefix}<red>Uso: <gray>/mina particular <menu|info|deletar|expandir|home|compartilhar>"
    expand: "{prefix}<red>Uso: <gray>/mina particular expandir <quantidade>"
    share: "{prefix}<red>Uso: <gray>/mina particular compartilhar <jogador>"
    mina: "{prefix}<red>Uso: <gray>/mina [ir <id>|sair|lista|ranking|particular info|particular deletar]"

mine:
  teleported: "{prefix}<green>Teleportado para a mina <white>{mine}<green>."
  left: "{prefix}<gray>Você saiu da área de minas."
  no-mine-available: "{prefix}<red>Nenhuma mina disponível para você no momento."
  access:
    permission-denied: "{prefix}<red>Você precisa da permissão <white>{permission} <red>para entrar em '<white>{mine}<red>'."
    level-denied: "{prefix}<red>Você precisa de nível de picareta <yellow>{level} <red>para entrar em '<white>{mine}<red>'."
  mine:
    level-denied: "{prefix}<red>Você precisa de nível de picareta <yellow>{level} <red>para minerar aqui."
  reward:
    currency: "{prefix}<gold>+{amount} {currency}"

ranking:
  empty: "{prefix}<red>Ainda não há dados suficientes para o ranking."

private-mine:
  not-found: "{prefix}<red>Você não tem uma mina particular."
  not-in-mine: "{prefix}<red>Você não está numa mina particular."
  not-owner: "{prefix}<red>Essa mina não é sua."
  not-in-plot: "{prefix}<red>Você não tem uma mina particular nesta plot."
  not-here: "{prefix}<red>Não existe uma mina particular sua aqui."
  limit-reached: "{prefix}<red>Limite de minas atingido."
  no-permission: "{prefix}<red>Sem permissão para criar minas particulares."
  no-template: "{prefix}<red>Nenhum template disponível."
  no-plot: "{prefix}<red>Você precisa estar numa plot para criar uma mina particular."
  plot-occupied: "{prefix}<red>Esta plot já tem uma mina particular."
  invalid-plot: "{prefix}<red>Plot inválida ou não encontrada."
  deleted: "{prefix}<green>Mina particular removida."
  delete-failed: "{prefix}<red>Não foi possível remover a mina particular."
  delete-confirm: "{prefix}<yellow>Digite <gray>/mina particular deletar <yellow>novamente em até 5s para confirmar."
  teleported: "{prefix}<green>Teleportado para sua mina particular."
  teleported-home: "{prefix}<green>Você foi levado ao topo da sua mina."
  expanded: "{prefix}<green>Mina expandida em <white>{amount} <green>bloco(s) para cada lado! Novos blocos preenchidos."
  upgrade-success: "{prefix}<green>Mina expandida! Custo descontado."
  reset-set: "{prefix}<green>Reset definido para <white>{minutes} <green>min."
  none-found: "{prefix}<red>Nenhuma mina particular encontrada."
  none-in-plot: "{prefix}<red>Nenhuma mina particular encontrada nesta plot."
  shared: "{prefix}<green>Mina particular compartilhada com <white>{target}<green>."
  member-added: "{prefix}<white>{target} <green>agora é membro da sua mina."
  member-added-target: "{prefix}<green>Você agora pode usar a mina de <white>{owner}<green>."
  cannot-share-self: "{prefix}<red>Você não pode compartilhar sua mina com você mesmo."
  already-member: "{prefix}<red>Esse jogador já tem acesso."
  access-removed: "{prefix}<green>Acesso removido."
  not-member: "{prefix}<red>Esse jogador não tem acesso."
  unprotected: "{prefix}<green>Mina particular desprotegida."
  level-insufficient: "{prefix}<red>Nível insuficiente para esta mina particular."
  level-insufficient-short: "{prefix}<red>Nível insuficiente."
  mine-permission-denied: "{prefix}<red>Você não tem permissão para minerar nesta mina particular."
  build-permission-denied: "{prefix}<red>Você não tem permissão para construir nesta mina particular."
  command-denied: "{prefix}<red>Você não tem permissão para usar este comando aqui."
  kicked: "{prefix}<red>Você foi expulso da mina particular de <white>{owner}<red>."
  owner-left: "{prefix}<red>O dono da mina particular saiu. Você foi teleportado para o spawn."
  info:
    header: "<dark_gray>◈ <gold><bold>Mina Particular <dark_gray>◈"
    type: " <gray>Tipo: <white>{type}"
    owner: " <gray>Dono: <white>{owner}"
    blocks: " <gray>Blocos: <white>{blocks} <gray>(<yellow>{percentage}%<gray>)"
    next-reset: " <gray>Próx. Reset: <white>{interval}min <gray>/ <white>{time}"
    rarity: " <gray>Raridade: {rarity}"
    founded: " <gray>Fundada: <white>{date}"
    expires: " <gray>Expira: <white>{date}"

admin:
  mine-created: "{prefix}<green>Mina '<white>{mine}<green>' criada com sucesso."
  mine-deleted: "{prefix}<green>Mina '<white>{mine}<green>' deletada."
  reset-started: "{prefix}<green>Reset da mina '<white>{mine}<green>' iniciado."
  spawn-set: "{prefix}<green>Spawn da mina '<white>{mine}<green>' atualizado."
  lobby-set: "{prefix}<green>Área da mina '<white>{mine}<green>' (lobby/dungeon) definida."
  lobby-info: "{prefix}<gray>A região de mineração continua sendo a original."
  lobby-removed: "{prefix}<green>Área da mina '<white>{mine}<green>' removida."
  exit-set: "{prefix}<green>Saída global atualizada."
  no-mines: "{prefix}<red>Nenhuma mina criada ainda."
  mine-list:
    header: "{prefix}<yellow>Minas registradas <gray>({count}):"
    entry: " <dark_gray>- <white>{mine} <gray>({blocks} blocos restantes){lobby}"
  reloaded: "{prefix}<green>Configuração do AlkaMines recarregada."
  renamed: "{prefix}<green>Mina '<white>{mine}<green>' renomeada para '<white>{name}<green>'."
  debug-on: "{prefix}<green>Debug do AlkaMines <dark_green>LIGADO<green>."
  debug-off: "{prefix}<green>Debug do AlkaMines <red>DESLIGADO<green>."
  generator-given: "{prefix}<green>Gerador de '<white>{template}<green>' entregue a <white>{player}<green>."
  generator-received: "{prefix}<green>Você recebeu um gerador de mina particular! <gray>Use com clique direito na sua plot."
  schematics:
    header: "{prefix}<yellow>Schematics encontrados <gray>({count}):"
    empty: "{prefix}<red>Nenhum .schem. Fluxo: <gray>//wand, selecione, //copy, //schem save <nome><red>."
    entry: " <dark_gray>- <white>{file} <dark_gray>(<gray>{folder}<dark_gray>) <dark_gray>→ <white>{templates}"
    hint: "{prefix}<gray>Dica: defina 'schematic: <nome>' no template e rode /alkamines reload."
  mine-registered: "{prefix}<green>Mina '<white>{name}<green>' registrada no template '<white>{template}<green>'."
  hologram-set: "{prefix}<green>Holograma setado em <white>{x} {y} {z}<green>."
  delete-confirm: "{prefix}<red>Shift+Click para confirmar a exclusão."
  composition:
    exists: "{prefix}<red>Esse material já está na composição. Clique nele para editar."
    added: "{prefix}<green>{material} <green>adicionado com chance 10 (relativa)."
    removed: "{prefix}<red>{material} <red>removido da composição."
    prompt-xp: "{prefix}<yellow>Digite o XP normal (vanilla) dado ao quebrar este bloco <gray>(0 = nenhum)<yellow>. Digite <gray>cancelar <yellow>para voltar."
    prompt-mcmmo: "{prefix}<yellow>Digite o XP de mcMMO (Mineração) dado ao quebrar este bloco <gray>(0 = nenhum)<yellow>. Digite <gray>cancelar <yellow>para voltar."
    xp-set: "{prefix}<green>{material} <green>agora dá <white>{xp} <green>XP {type} ao quebrar."
  reset:
    prompt-interval: "{prefix}<yellow>Digite o intervalo de reset em minutos <gray>(ex: 30)<yellow>. Digite <gray>cancelar <yellow>para voltar."
    prompt-percentage: "{prefix}<yellow>Digite a porcentagem restante para resetar <gray>(0 a 100)<yellow>. Digite <gray>cancelar <yellow>para voltar."
    prompt-permission: "{prefix}<yellow>Digite a permissão necessária <gray>(ex: alkaminas.mina.vip)<yellow>. Digite <gray>remover <yellow>para liberar ou <gray>cancelar <yellow>para voltar."
    prompt-actionbar: "{prefix}<yellow>Digite o raio (em blocos) do ActionBar. Digite <gray>cancelar <yellow>para voltar."
    prompt-broadcast: "{prefix}<yellow>Digite o modo de broadcast: <gray>0=mundo, -1=todos, -2=silencioso, N=raio<yellow>. Digite <gray>cancelar <yellow>para voltar."
    prompt-command: "{prefix}<yellow>Digite um comando para rodar no reset <gray>(sem /, use %mine% e %display%)<yellow>. Digite <gray>limpar <yellow>para esvaziar ou <gray>cancelar <yellow>para voltar."
    prompt-category: "{prefix}<yellow>Digite a categoria desta mina <gray>(ex: vip, pvp, ranking)<yellow>. Digite <gray>cancelar <yellow>para voltar."
    prompt-rename: "{prefix}<yellow>Digite o novo nome de exibição desta mina. Digite <gray>cancelar <yellow>para voltar."
    interval-set: "{prefix}<green>Intervalo de reset definido para <white>{minutes} <green>minutos."
    percentage-set: "{prefix}<green>Porcentagem de reset definida para <white>{percentage}%<green>."
    category-set: "{prefix}<green>Categoria da mina '<white>{mine}<green>' definida como '<white>{category}<green>'."
    permission-removed: "{prefix}<green>Permissão removida. Mina '<white>{mine}<green>' agora é pública."
    permission-set: "{prefix}<green>Permissão da mina '<white>{mine}<green>' definida como '<white>{permission}<green>'."
    actionbar-set: "{prefix}<green>Raio do ActionBar definido para <white>{range} <green>blocos."
    broadcast-set: "{prefix}<green>Broadcast do reset definido para o modo <white>{mode}<green>."
    commands-cleared: "{prefix}<green>Lista de comandos de reset esvaziada."
    command-added: "{prefix}<green>Comando adicionado: <gray>/{command}"
  reward:
    command-added: "{prefix}<green>Comando adicionado: <gray>/{command}"
    commands-cleared: "{prefix}<green>Lista de comandos esvaziada."
