name: AlkaMines
version: '${version}'
main: com.alka.mines.AlkaMines
api-version: '1.21.8'
author: MestreDEV
description: Sistema de minas/prison - selecao via WorldEdit, reset em massa via FAWE, hologramas e GUIs.
depend: [AlkaCore, FastAsyncWorldEdit]
softdepend: [PlaceholderAPI, DecentHolograms, AlkaEconomy, AlkaShop, AlkaDrop, AdvancedEnchantments, mcMMO, ItemsAdder, BossesPro, PlotSquared, AlkaVips]

commands:
  alkamines:
    description: Gerencia as minas do servidor.
    aliases: [minaadmin, minadmin, ma]
    usage: /<command> <criar|deletar|editar|resetar|setspawn|setlobby|removelobby|setsaida|lista|reload|renomear|debug|givegerador|esquematicos|registrarmina>
  mina:
    description: Abre o menu de minas, teleporta ou sai de uma mina.
    aliases: [minas]
    usage: /<command> [ir <id>|sair|lista|ranking|particular menu|particular info|particular deletar|particular expandir <quantidade>|particular home|particular compartilhar <jogador>]

permissions:
  alkaminas.admin.criar:
    description: Cria uma mina a partir da selecao do WorldEdit.
    default: op
  alkaminas.admin.deletar:
    description: Deleta uma mina.
    default: op
  alkaminas.admin.editar:
    description: Abre o menu administrativo de uma mina.
    default: op
  alkaminas.admin.resetar:
    description: Forca o reset imediato de uma mina.
    default: op
  alkaminas.admin.setspawn:
    description: Define o spawn de uma mina na posicao atual.
    default: op
  alkaminas.admin.setlobby:
    description: Define a area da mina (lobby/dungeon) a partir da selecao do WorldEdit.
    default: op
  alkaminas.admin.removelobby:
    description: Remove a area da mina (lobby/dungeon) de uma mina.
    default: op
  alkaminas.admin.setsaida:
    description: Define a saida global das minas na posicao atual.
    default: op
  alkaminas.admin.lista:
    description: Lista todas as minas cadastradas.
    default: op
  alkaminas.admin.reload:
    description: Recarrega mines.yml do disco (salva o progresso atual antes).
    default: op
  alkaminas.admin.renomear:
    description: Renomeia o nome de exibicao de uma mina.
    default: op
  alkaminas.admin.build:
    description: Permite colocar blocos dentro da area de uma mina.
    default: op
  alkaminas.admin.bypass.commands:
    description: Ignora o bloqueio de comandos (mine-protection.blocked-commands) dentro de uma mina.
    default: op
  alkaminas.admin.debug:
    description: Liga/desliga o log de debug do AlkaMines no console.
    default: op
  alkaminas.admin.givegerador:
    description: Da o item gerador de mina particular para um jogador.
    default: op
  alkaminas.admin.esquematicos:
    description: Lista os schematics disponiveis e os templates que os usam.
    default: op
  alkaminas.admin.registrarmina:
    description: Salva a selecao do WorldEdit como schematic e amarra num template de mina particular.
    default: op
  alkaminas.ir:
    description: Permite usar /mina ir para teleportar ate uma mina.
    default: true

  alkaminas.mina.vip:
    description: Acesso a uma mina marcada como exigindo esta permissao (exemplo).
    default: false
  alkaminas.mina.supervip:
    description: Acesso a uma mina marcada como exigindo esta permissao (exemplo).
    default: false
